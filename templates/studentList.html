<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
</head>
<body>
    <h1>Student List</h1>
    <p><a href="{% url 'student-create' %}">Add Student</a></p>

    {% if students %}
    <table>
        <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Marks</th>
            <th>Phone Number</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td><a href="{% url 'student-detail' student.pk %}">{{ student.name }}</a></td>
            <td>{{ student.rollNumber }}</td>
            <td>{{ student.marks }}</td>
            <td>{{ student.phoneNumber }}</td>
            <td>
                <a href="{% url 'student-update' student.pk %}">Update</a> |
                <a href="{% url 'student-delete' student.pk %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No students found.</p>
    {% endif %}
</body>
</html>
